name: circuitiq

services:
    postgres:
      image: postgres:17
      environment:
        POSTGRES_USER: circuitiq_dev 
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        POSTGRES_DB: circuitiq
      ports:
        - "127.0.0.1:5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
        interval: 5s
        timeout: 5s
        retries: 10



volumes:
  postgres_data:

    

   