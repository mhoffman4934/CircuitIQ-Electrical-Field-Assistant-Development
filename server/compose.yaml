services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: circuitiq
      POSTGRES_PASSWORD: circuitiq_local
      POSTGRES_DB: circuitiq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - circuitiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitiq -d circuitiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  circuitiq_postgres:
